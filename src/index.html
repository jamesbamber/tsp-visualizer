<!DOCTYPE html>
<html>
    <head>
        <title>TSP visualizer</title>
    
        <script type="module" src="js/main.js"></script>
        <link rel="stylesheet" href="css/style.css">

    </head>
    
    <body>
        <header class="banner"> TSP visualizer </header>
        <main>
            <aside id="options">
                <div class="option-box">
                    <label>Number of points: <span id="number-of-points-label">50</span> </label>
                    <input type="range" min="1" max="100" value="50" class="slider" id="number-of-points">
                    <button id="generate-points">Generate</button>
                </div>
            </aside>
            <canvas id="canvas" height="1000" width="1000"></canvas>
        </main>
    </body>

</html>
