<!DOCTYPE html>
<html>
    <head>
        <title>TSP visualizer</title>
    
        <script type="module" src="js/main.js"></script>
        <link rel="stylesheet" href="css/style.css">

    </head>
    
    <body>
        <header class="banner"> 
            <h3>TSP visualizer</h3>
            <div id="login-container">
                <button id="login">Login</button>
                <button id="register">Register</button>
            </div>
        </header>
        <main>
            <aside id="options">
                <div class="option-box">
                    <label>Number of points: <span id="number-of-points-label"></span> </label>
                    <input type="range" min="1" max="100" value="20" class="slider" id="number-of-points">
                    <button id="generate-points">Generate</button>
                </div>
                <div class="option-box">
                    <label> Algorithm: </label>
                    <select id="chosen-algorithm"> </select>
                    <button id="run-algorithm">Run</button>
                    <button id="stop-algorithm">Stop</button>
                    <label>Delay (ms): <span id="delay-time-label"></span> </label>
                    <input type="range" min="10" max="200" value="100" class="slider" id="delay-time">
                </div>
                <div class="option-box" id="path-length-box">
                    <label> Current Path: </label><span id="current-path"></span>
                    <label> Current Best: </label><span id="best-path"></span>
                </div>

            </aside>
            <div id="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </main>
    </body>

</html>
